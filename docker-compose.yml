services:
  ebys-db:
    image: postgres:17-alpine
    container_name: ebys_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  ebys-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TELERIK_USERNAME: ${TELERIK_USERNAME}
        TELERIK_PASSWORD: ${TELERIK_PASSWORD}
    container_name: ebys_webapi
    env_file: .env
    ports:
      - "${API_PORT}:8080"
    environment:
      ConnectionStrings__DbConnection: Host=ebys-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      GeminiSettings__ApiKey: ${GEMINI_API_KEY}
    depends_on:
      - ebys-db

  ebys-web:
    build:
      context: .
      dockerfile: EBYS.Web/Dockerfile
      args:
        TELERIK_USERNAME: ${TELERIK_USERNAME}
        TELERIK_PASSWORD: ${TELERIK_PASSWORD}
    container_name: ebys_web
    env_file: .env
    ports:
      - "${WEB_PORT}:8080"
    environment:
      ApiSettings__BaseUrl: http://ebys-api:8080/api/
    depends_on:
      - ebys-api

volumes:
  postgres_data:
